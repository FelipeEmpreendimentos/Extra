name: Apply SalesBoard product coherence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/salesboard-product-coherence-temp.yml"
      - "salesboard/scripts/finalize_product_coherence.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply final coherence fixes
        run: python salesboard/scripts/finalize_product_coherence.py

      - name: Validate final behavior
        run: |
          node --check salesboard/app/app.js
          grep -Fq "GOAL_REQUIRES_INCOME" salesboard/app/app.js
          grep -Fq "type === 'income'" salesboard/app/app.js
          grep -Fq "() => exportCSV()" salesboard/app/app.js
          grep -Fq "subtitle: 'Meta'" salesboard/app/app.js

      - name: Commit final coherence fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/app.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Refine goal semantics and export behavior"
          git push origin main
