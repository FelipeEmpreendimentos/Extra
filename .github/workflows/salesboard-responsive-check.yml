name: Validate SalesBoard responsiveness

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/salesboard-responsive-check.yml"
      - "salesboard/scripts/responsive_audit.mjs"
      - "salesboard/scripts/ui_contract_audit.mjs"
      - "salesboard/index.html"
      - "salesboard/styles.css"
      - "salesboard/launch.css"
      - "salesboard/quality.css"
      - "salesboard/app/index.html"
      - "salesboard/app/app.css"
      - "salesboard/app/quality.css"
      - "salesboard/app/app.js"
      - "salesboard/app/runtime-bridge.js"
  pull_request:
    branches: ["main"]
    paths:
      - "salesboard/scripts/responsive_audit.mjs"
      - "salesboard/scripts/ui_contract_audit.mjs"
      - "salesboard/index.html"
      - "salesboard/styles.css"
      - "salesboard/launch.css"
      - "salesboard/quality.css"
      - "salesboard/app/index.html"
      - "salesboard/app/app.css"
      - "salesboard/app/quality.css"
      - "salesboard/app/app.js"
      - "salesboard/app/runtime-bridge.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Guard interaction consistency
        run: |
          grep -Fq 'reactivateEntity' salesboard/app/app.js
          grep -Fq 'setResendConfirmation' salesboard/app/app.js
          grep -Fq 'authCallbackMessage' salesboard/app/app.js
          grep -Fq 'error_description' salesboard/app/app.js
          grep -Fq 'email_address_invalid' salesboard/app/app.js
          grep -Fq 'session_not_found' salesboard/app/app.js
          grep -Fq 'account_is_archived' salesboard/app/app.js
          grep -Fq 'category_is_archived' salesboard/app/app.js
          grep -Fq 'Não foi possível concluir esta ação de acesso' salesboard/app/app.js
          grep -Fq 'form.noValidate = true' salesboard/app/app.js
          grep -Fq 'id="archived-items"' salesboard/app/index.html
          grep -Fq 'id="keep-connected"' salesboard/app/index.html
          grep -Fq 'authSessionStorage' salesboard/app/app.js
          grep -Fq 'setRememberPreference' salesboard/app/app.js
          grep -Fq 'aria-live="polite"' salesboard/app/index.html
          for form in login-form register-form forgot-form recovery-form onboarding-form profile-form transaction-form entity-form confirm-form; do grep -Pq "<form id=\"$form\"[^>]*novalidate" salesboard/app/index.html || { echo "$form uses browser-native validation"; exit 1; }; done
          if grep -Pq '\b(confirm|prompt|alert)\s*\(' salesboard/app/app.js salesboard/app/runtime-bridge.js salesboard/app.js salesboard/legal/legal.js; then echo 'Native browser dialog found'; exit 1; fi
          if grep -Pq '\breportValidity\s*\(' salesboard/app/app.js salesboard/app/runtime-bridge.js; then echo 'Native validation UI found'; exit 1; fi
      - name: Install browser audit dependency
        working-directory: salesboard
        run: |
          npm install --no-save --ignore-scripts --no-fund --no-audit playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/salesboard-http.log 2>&1 &
          echo $! > /tmp/salesboard-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/salesboard/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/salesboard-http.log
          exit 1
      - name: Run UI contract regressions
        run: node salesboard/scripts/ui_contract_audit.mjs
      - name: Run reviewed product viewport matrix
        run: node salesboard/scripts/responsive_audit.mjs
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salesboard-responsive-audit
          path: salesboard/audit-artifacts
          if-no-files-found: warn
          retention-days: 3
