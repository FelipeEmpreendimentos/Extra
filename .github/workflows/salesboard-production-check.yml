name: Validate SalesBoard production

on:
  push:
    branches: [main]
    paths:
      - "salesboard/**"
      - ".github/workflows/salesboard-production-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "salesboard/**"
      - ".github/workflows/salesboard-production-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use production Node version
        uses: actions/setup-node@v5
        with:
          node-version-file: "salesboard/.node-version"

      - name: Check launch files
        run: |
          test -f salesboard/index.html
          test -f salesboard/styles.css
          test -f salesboard/launch.css
          test -f salesboard/quality.css
          test -f salesboard/app.js
          test -f salesboard/app/index.html
          test -f salesboard/app/app.css
          test -f salesboard/app/quality.css
          test -f salesboard/app/app.js
          test -f salesboard/app/runtime-bridge.js
          test -f salesboard/favicon.svg
          test -f salesboard/manifest.webmanifest
          test -f salesboard/robots.txt
          test -f salesboard/404.html
          test -f salesboard/contato.html
          test -f salesboard/legal/privacidade.html
          test -f salesboard/legal/termos.html
          test -f salesboard/legal/seguranca.html
          test -f salesboard/supabase/schema.sql
          for migration in 002_integrity 003_recurring 004_three_day_trial 005_lock_entitlement_rpc 006_trial_once_per_email 007_choose_trial_plan_once 008_fix_trial_digest_schema 009_atomic_onboarding_completion 010_profile_security_defaults; do test -f "salesboard/supabase/${migration}.sql"; done
          for fn in salesboard-checkout salesboard-billing-portal salesboard-delete-account salesboard-stripe-webhook salesboard-health; do test -f "salesboard/supabase/functions/${fn}/index.ts"; done
          test -f salesboard/.env.example
          test -f salesboard/.gitignore
          test -f salesboard/.node-version

      - name: Install pinned production dependencies
        working-directory: salesboard
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Validate browser JavaScript syntax
        working-directory: salesboard
        run: npm run check

      - name: Audit production dependencies
        working-directory: salesboard
        run: npm audit --omit=dev --audit-level=high

      - name: Check database and entitlement invariants
        run: |
          grep -Fq 'enable row level security' salesboard/supabase/schema.sql
          grep -Fq 'current_entitlement' salesboard/supabase/schema.sql
          grep -Fq 'validate_transaction_references' salesboard/supabase/002_integrity.sql
          grep -Fq 'validate_recurrence_source' salesboard/supabase/003_recurring.sql
          grep -Fq 'extensions.digest' salesboard/supabase/008_fix_trial_digest_schema.sql
          grep -Fq 'complete_salesboard_onboarding' salesboard/supabase/009_atomic_onboarding_completion.sql
          grep -Fq "subscription_status set default 'none'" salesboard/supabase/010_profile_security_defaults.sql
          grep -Fq 'revoke all on function public.touch_updated_at()' salesboard/supabase/010_profile_security_defaults.sql
          grep -Fq 'revoke execute on function public.current_entitlement(uuid)' salesboard/supabase/005_lock_entitlement_rpc.sql
          if grep -Fq 'localStorage' salesboard/app/app.js; then echo 'Production app must not use localStorage as a financial database'; exit 1; fi

      - name: Check Edge Function security and billing invariants
        run: |
          grep -Fq "admin.auth.getUser(token)" salesboard/supabase/functions/salesboard-checkout/index.ts || { echo 'checkout auth validation missing'; exit 1; }
          grep -Fq "admin.auth.getUser(token)" salesboard/supabase/functions/salesboard-billing-portal/index.ts || { echo 'billing portal auth validation missing'; exit 1; }
          grep -Fq "constructEventAsync" salesboard/supabase/functions/salesboard-stripe-webhook/index.ts || { echo 'Stripe signature verification missing'; exit 1; }
          grep -Fq "STRIPE_WEBHOOK_SECRET" salesboard/supabase/functions/salesboard-stripe-webhook/index.ts || { echo 'webhook secret configuration missing'; exit 1; }
          grep -Fq 'STRIPE_PRICE_' salesboard/supabase/functions/salesboard-checkout/index.ts || { echo 'live price configuration missing'; exit 1; }
          grep -Fq "STRIPE_PRODUCT_ESSENTIAL" salesboard/supabase/functions/salesboard-billing-portal/index.ts || { echo 'live product configuration missing'; exit 1; }
          grep -Fq "STRIPE_SECRET_KEY" salesboard/supabase/functions/salesboard-health/index.ts || { echo 'health billing readiness check missing'; exit 1; }
          if grep -PqR --exclude=.env.example 'sk_(live|test)_(?!x{8,})[A-Za-z0-9]{20,}' salesboard; then echo 'Possible Stripe secret committed'; exit 1; fi

      - name: Build clean GitHub Pages artifact
        working-directory: salesboard
        run: |
          rm -rf .ci-dist
          mkdir -p .ci-dist
          cp index.html styles.css launch.css quality.css app.js favicon.svg manifest.webmanifest robots.txt 404.html contato.html .ci-dist/
          cp -R app legal .ci-dist/
          test -f .ci-dist/index.html
          test -f .ci-dist/quality.css
          test -f .ci-dist/app/index.html
          test -f .ci-dist/app/quality.css
          test -f .ci-dist/legal/privacidade.html
          test ! -e .ci-dist/supabase
          test ! -e .ci-dist/.env.example
          test ! -e .ci-dist/package.json

      - name: Check launch transparency and product rules
        run: |
          grep -Fq '3 dias grátis' salesboard/index.html
          if grep -Fq '7 dias grátis' salesboard/index.html; then echo 'Old 7-day trial copy must not remain on the landing page'; exit 1; fi
          grep -Fq 'data-monthly="14,90"' salesboard/index.html
          grep -Fq 'data-monthly="24,90"' salesboard/index.html
          grep -Fq 'Até 3 contas ativas' salesboard/index.html
          grep -Fq 'Relatórios avançados de 12 meses' salesboard/index.html
          grep -Fq 'google-auth-button' salesboard/app/index.html
          grep -Fq "provider: 'google'" salesboard/app/app.js
          grep -Fq 'report-year-chart' salesboard/app/index.html
          grep -Fq 'legal/privacidade.html' salesboard/index.html
          grep -Fq 'legal/termos.html' salesboard/index.html
          grep -Fq 'Excluir minha conta' salesboard/app/index.html
          grep -Fq 'Gerenciar cobrança' salesboard/app/index.html
          grep -Fq 'O período começa só depois da sua escolha' salesboard/index.html
          if grep -q 'Marina Costa\|Rafael Lima\|Ana Souza' salesboard/index.html; then echo 'Fictitious testimonials must not appear as launch social proof'; exit 1; fi
          if grep -Fq 'Negócios' salesboard/index.html; then echo 'Unreleased Negocios plan must not be advertised'; exit 1; fi
