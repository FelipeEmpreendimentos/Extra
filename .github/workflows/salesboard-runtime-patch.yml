name: Patch SalesBoard runtime bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/salesboard-runtime-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Inject runtime bridge into public pages
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('salesboard/app/index.html')
          text = app.read_text(encoding='utf-8')
          marker = '<script src="app.js" defer></script>'
          bridge = '<script src="runtime-bridge.js"></script>\n  ' + marker
          if 'runtime-bridge.js' not in text:
              if marker not in text:
                  raise SystemExit('app.js marker not found')
              text = text.replace(marker, bridge, 1)
              app.write_text(text, encoding='utf-8')

          for path in ['salesboard/legal/privacidade.html', 'salesboard/legal/termos.html', 'salesboard/legal/seguranca.html']:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              marker = '<script src="legal.js" defer></script>'
              bridge = '<script src="../app/runtime-bridge.js"></script><script src="legal.js" defer></script>'
              if 'runtime-bridge.js' not in text:
                  if marker not in text:
                      raise SystemExit(f'legal.js marker not found in {path}')
                  text = text.replace(marker, bridge, 1)
                  p.write_text(text, encoding='utf-8')

          contact = Path('salesboard/contato.html')
          text = contact.read_text(encoding='utf-8')
          marker = '<script src="legal/legal.js" defer></script>'
          bridge = '<script src="app/runtime-bridge.js"></script><script src="legal/legal.js" defer></script>'
          if 'runtime-bridge.js' not in text:
              if marker not in text:
                  raise SystemExit('contact legal.js marker not found')
              text = text.replace(marker, bridge, 1)
              contact.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Nothing to patch"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/index.html salesboard/legal/*.html salesboard/contato.html
          git commit -m "Connect SalesBoard Pages frontend to production runtime"
          git push origin main
