name: Apply SalesBoard product coherence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/salesboard-product-coherence-temp.yml"
      - "salesboard/scripts/apply_product_coherence.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Fix patch helper and apply coherence patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('salesboard/scripts/apply_product_coherence.py')
          text = path.read_text(encoding='utf-8')
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          if old not in text:
              raise SystemExit('sub_once helper not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python salesboard/scripts/apply_product_coherence.py

      - name: Validate JavaScript and required relationships
        run: |
          node --check salesboard/app/app.js
          node --check salesboard/app.js
          grep -Fq 'id="report-month"' salesboard/app/index.html
          grep -Fq 'id="tx-goal"' salesboard/app/index.html
          grep -Fq 'goal_id' salesboard/app/app.js
          grep -Fq 'complete_salesboard_onboarding' salesboard/app/app.js
          if grep -Fq '2 meses grátis' salesboard/index.html salesboard/app/index.html; then exit 1; fi

      - name: Commit product coherence changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/index.html salesboard/app/app.js salesboard/app/quality.css salesboard/index.html salesboard/README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Align SalesBoard product flows and monthly reports"
          git push origin main
