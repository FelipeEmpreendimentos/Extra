name: SalesBoard UI polish temporary

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/salesboard-ui-polish-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Apply modal and money-field polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('salesboard/app/runtime-bridge.js')
          css = Path('salesboard/app/app.css')

          js = runtime.read_text(encoding='utf-8')
          old = "input.setAttribute('pattern', '[0-9]*');"
          new = "input.removeAttribute('pattern');\n    input.removeAttribute('step');\n    input.removeAttribute('min');\n    input.removeAttribute('max');\n    input.setCustomValidity('');"
          if old in js:
              js = js.replace(old, new, 1)

          js_marker = 'SB_MODAL_SYSTEM_V2'
          js_patch = r'''

// SB_MODAL_SYSTEM_V2
(() => {
  'use strict';

  const modalSelector = '.modal';
  const formSelector = '.modal form';

  function visibleField(field) {
    if (!(field instanceof HTMLElement) || field.disabled) return false;
    if (field.closest('[hidden]')) return false;
    return true;
  }

  function fieldContainer(field) {
    return field.closest('label') || field.closest('.field') || field.parentElement;
  }

  function clearFieldError(field) {
    if (!(field instanceof HTMLElement)) return;
    field.removeAttribute('aria-invalid');
    const container = fieldContainer(field);
    if (!container) return;
    container.classList.remove('sb-field-invalid');
    const error = container.querySelector(':scope > .sb-field-error');
    if (error) error.remove();
  }

  function setFieldError(field, message) {
    const container = fieldContainer(field);
    if (!container) return;
    clearFieldError(field);
    container.classList.add('sb-field-invalid');
    field.setAttribute('aria-invalid', 'true');
    const error = document.createElement('small');
    error.className = 'sb-field-error';
    error.setAttribute('role', 'alert');
    error.textContent = message;
    container.appendChild(error);
  }

  function valueMissing(field, form) {
    if (!field.required || !visibleField(field)) return false;
    const type = String(field.type || '').toLowerCase();
    if (type === 'checkbox') return !field.checked;
    if (type === 'radio') {
      if (!field.name) return !field.checked;
      return !form.querySelector(`input[type="radio"][name="${CSS.escape(field.name)}"]:checked`);
    }
    return String(field.value ?? '').trim() === '';
  }

  function validateModalForm(form) {
    form.querySelectorAll('.sb-field-error').forEach((node) => node.remove());
    form.querySelectorAll('.sb-field-invalid').forEach((node) => node.classList.remove('sb-field-invalid'));
    form.querySelectorAll('[aria-invalid="true"]').forEach((node) => node.removeAttribute('aria-invalid'));

    let firstInvalid = null;
    const required = [...form.querySelectorAll('[required]')];
    for (const field of required) {
      if (valueMissing(field, form)) {
        setFieldError(field, field.type === 'checkbox' ? 'Confirme esta opção para continuar.' : 'Preencha este campo para continuar.');
        firstInvalid ||= field;
      }
    }

    const transactionAmount = form.querySelector('#tx-amount, [name="amount"]');
    if (transactionAmount && visibleField(transactionAmount)) {
      const digits = String(transactionAmount.value || '').replace(/\D/g, '');
      if (!digits || Number(digits) <= 0) {
        setFieldError(transactionAmount, 'Informe um valor maior que zero.');
        firstInvalid ||= transactionAmount;
      }
    }

    if (firstInvalid) {
      firstInvalid.focus({ preventScroll: true });
      firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return false;
    }
    return true;
  }

  function prepareForm(form) {
    if (!(form instanceof HTMLFormElement)) return;
    form.noValidate = true;
    form.setAttribute('novalidate', 'novalidate');
    form.querySelectorAll('.money-field input').forEach((input) => {
      input.type = 'text';
      input.inputMode = 'numeric';
      input.removeAttribute('pattern');
      input.removeAttribute('step');
      input.removeAttribute('min');
      input.removeAttribute('max');
      input.setCustomValidity('');
    });
  }

  function enhanceModal(modal) {
    if (!(modal instanceof HTMLElement) || !modal.matches(modalSelector)) return;
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.querySelectorAll('form').forEach(prepareForm);
    modal.querySelectorAll('[data-close-modal]').forEach((button) => {
      if (button instanceof HTMLButtonElement) button.type = 'button';
      if (!button.getAttribute('aria-label')) button.setAttribute('aria-label', 'Fechar janela');
    });
  }

  function focusOpenedModal(modal) {
    if (modal.hidden) return;
    requestAnimationFrame(() => {
      const target = modal.querySelector('[autofocus], input:not([type="hidden"]):not([disabled]), select:not([disabled]), textarea:not([disabled])');
      target?.focus({ preventScroll: true });
    });
  }

  document.querySelectorAll(modalSelector).forEach((modal) => {
    enhanceModal(modal);
    if (!modal.hidden) focusOpenedModal(modal);
  });

  document.addEventListener('submit', (event) => {
    const form = event.target;
    if (!(form instanceof HTMLFormElement) || !form.matches(formSelector)) return;
    prepareForm(form);
    if (!validateModalForm(form)) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }, true);

  document.addEventListener('input', (event) => {
    const field = event.target;
    if (field instanceof HTMLInputElement || field instanceof HTMLTextAreaElement) clearFieldError(field);
  }, true);

  document.addEventListener('change', (event) => {
    const field = event.target;
    if (field instanceof HTMLInputElement || field instanceof HTMLSelectElement) clearFieldError(field);
  }, true);

  document.addEventListener('invalid', (event) => {
    const field = event.target;
    if (!(field instanceof HTMLElement) || !field.closest('.modal')) return;
    event.preventDefault();
  }, true);

  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return;
    const modal = [...document.querySelectorAll(modalSelector)].reverse().find((item) => !item.hidden);
    const close = modal?.querySelector('[data-close-modal]');
    close?.click();
  });

  const observer = new MutationObserver((mutations) => {
    for (const mutation of mutations) {
      if (mutation.type === 'attributes' && mutation.target instanceof HTMLElement && mutation.target.matches(modalSelector)) {
        enhanceModal(mutation.target);
        if (!mutation.target.hidden) focusOpenedModal(mutation.target);
      }
      mutation.addedNodes.forEach((node) => {
        if (!(node instanceof Element)) return;
        if (node.matches(modalSelector)) {
          enhanceModal(node);
          if (!node.hidden) focusOpenedModal(node);
        }
        node.querySelectorAll?.(modalSelector).forEach(enhanceModal);
        node.querySelectorAll?.(formSelector).forEach(prepareForm);
      });
    }
  });

  observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden'] });
})();
'''
          if js_marker not in js:
              js += js_patch
          runtime.write_text(js, encoding='utf-8')

          styles = css.read_text(encoding='utf-8')
          css_marker = 'SB_UI_SYSTEM_V2'
          css_patch = r'''

/* SB_UI_SYSTEM_V2 — unified dialogs, fields and billing polish */
:root{--sb-modal-radius:24px;--sb-field-radius:12px;--sb-control-h:44px;--sb-modal-shadow:0 32px 90px rgba(8,17,31,.24)}

.modal{padding:24px;background:rgba(8,17,31,.58);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow-y:auto;overscroll-behavior:contain}
.modal-card,.modal-card.small{display:flex;flex-direction:column;width:min(680px,calc(100vw - 40px));max-height:calc(100dvh - 48px);overflow:hidden;border:1px solid rgba(226,232,240,.9);border-radius:var(--sb-modal-radius);background:#fff;box-shadow:var(--sb-modal-shadow)}
.modal-card.small{width:min(560px,calc(100vw - 40px))}
.modal-card>header{flex:0 0 auto;padding:24px 26px 20px;gap:18px;background:#fff;border-bottom:1px solid #e6ebf0}
.modal-card>header .kicker{margin-bottom:8px}
.modal-card h2{font:800 22px/1.15 var(--display);letter-spacing:-.025em;margin:2px 0;color:#152033}
.modal-card>header .icon-button{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:#fbfcfd}
.modal-card>header .icon-button:hover{background:#f2f5f7;color:#172130}
.modal-card form{padding:22px 26px 24px;overflow-y:auto;overscroll-behavior:contain}
.modal-card form>footer{position:sticky;bottom:-24px;z-index:2;margin:24px -26px -24px;padding:18px 26px 22px;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid #e6ebf0;gap:10px}
.modal-card .form-grid{gap:18px 16px}
.modal-card .form-grid>label{gap:8px;font-size:11px;font-weight:750;color:#3b4758}
.modal-card .form-grid input,.modal-card .form-grid select,.modal-card .form-grid textarea{min-height:var(--sb-control-h);border-radius:var(--sb-field-radius);border-color:#d7dee7;background:#fff;padding:11px 13px;transition:border-color .15s,box-shadow .15s,background .15s}
.modal-card .form-grid textarea{min-height:96px;resize:vertical}
.modal-card .form-grid input:focus,.modal-card .form-grid select:focus,.modal-card .form-grid textarea:focus{border-color:#50cfaa;box-shadow:0 0 0 4px rgba(52,211,153,.11)}
.modal-card .money-field{min-height:var(--sb-control-h);border-radius:var(--sb-field-radius);border-color:#d7dee7;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.modal-card .money-field:focus-within{border-color:#50cfaa;box-shadow:0 0 0 4px rgba(52,211,153,.11)}
.modal-card .money-field span{padding-left:13px;font-size:12px;font-weight:750;color:#6b7889;white-space:nowrap}
.modal-card .money-field input{min-width:0;padding-left:8px!important;font-variant-numeric:tabular-nums}
.modal-card .type-switch{margin-bottom:20px;border-radius:12px;padding:4px}
.modal-card .type-switch span{padding:10px;border-radius:9px;font-size:10px}
.modal-card .button{min-height:44px;border-radius:12px;padding-left:18px;padding-right:18px}
.modal-card form>footer .button{min-width:106px}
.sb-field-error{display:block;margin-top:2px;color:#c43d4a;font-size:10px;font-weight:650;line-height:1.4}
.sb-field-invalid>input,.sb-field-invalid>select,.sb-field-invalid>textarea{border-color:#ef8b95!important;box-shadow:0 0 0 3px rgba(230,91,103,.09)!important}
.sb-field-invalid .money-field{border-color:#ef8b95!important;box-shadow:0 0 0 3px rgba(230,91,103,.09)!important}

.search-modal{width:min(720px,calc(100vw - 40px))}
.search-modal>header{padding:18px 20px;align-items:center}
.search-modal .global-search{height:46px;border-radius:12px;background:#f9fbfc}
.search-modal .search-results{overflow-y:auto;padding:10px 20px 22px}

.current-plan{align-items:center;padding:26px 24px;border:1px solid rgba(255,255,255,.04);box-shadow:0 10px 30px rgba(8,17,31,.08)}
.current-plan>div:first-child{min-width:0}
.current-plan>div:last-child{flex:0 0 auto;display:flex;align-items:baseline;justify-content:flex-end;gap:8px;min-width:150px;padding:12px 14px;border:1px solid rgba(255,255,255,.10);border-radius:12px;background:rgba(255,255,255,.045);white-space:nowrap}
.current-plan>div:last-child small{font-size:10px;color:#9cafc1;font-weight:650}
.current-plan>div:last-child strong{font:800 18px/1 var(--display);color:#fff;margin:0}
.billing-plans{gap:14px}
.billing-plans article{padding:24px;border-radius:18px}
.billing-plans article>strong{margin:12px 0}

.sb-delete-dialog{border-radius:var(--sb-modal-radius)!important;border:1px solid #e3e8ee!important;box-shadow:var(--sb-modal-shadow)!important}
.sb-delete-head{padding:24px 26px 18px!important}.sb-delete-body{padding:0 26px 24px!important}.sb-delete-actions{padding:18px 26px 22px!important}.sb-delete-btn{min-height:44px;border-radius:12px!important}

@media(max-width:680px){
  .modal{padding:12px;align-items:end}
  .modal-card,.modal-card.small,.search-modal{width:100%;max-height:calc(100dvh - 12px);border-radius:22px 22px 12px 12px}
  .modal-card>header{padding:20px 20px 16px}
  .modal-card form{padding:18px 20px 20px}
  .modal-card form>footer{bottom:-20px;margin:22px -20px -20px;padding:16px 20px max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr}
  .modal-card form>footer .button{width:100%;min-width:0}
  .modal-card .form-grid{gap:16px}
  .search-modal>header{padding:14px}
  .search-modal .search-results{padding:8px 14px 18px}
  .current-plan{display:grid;gap:18px;padding:22px}
  .current-plan>div:last-child{justify-content:flex-start;min-width:0;width:max-content;max-width:100%}
  .sb-delete-overlay{padding:12px!important;align-items:end!important}.sb-delete-dialog{border-radius:22px 22px 12px 12px!important}
}

@media(max-width:430px){
  .modal{padding:0}
  .modal-card,.modal-card.small,.search-modal{max-height:96dvh;border-radius:20px 20px 0 0}
  .modal-card>header{padding:18px 18px 15px}
  .modal-card form{padding:16px 18px 18px}
  .modal-card form>footer{margin:20px -18px -18px;padding:14px 18px max(16px,env(safe-area-inset-bottom))}
}
'''
          if css_marker not in styles:
              styles += css_patch
          css.write_text(styles, encoding='utf-8')
          PY

          node --check salesboard/app/runtime-bridge.js
          grep -q "SB_MODAL_SYSTEM_V2" salesboard/app/runtime-bridge.js
          grep -q "SB_UI_SYSTEM_V2" salesboard/app/app.css
          ! grep -q "input.setAttribute('pattern', '\[0-9\]\*')" salesboard/app/runtime-bridge.js

      - name: Commit UI polish
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/runtime-bridge.js salesboard/app/app.css
          git commit -m "Polish SalesBoard modals and money fields"
          git push
