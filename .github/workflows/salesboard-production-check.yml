name: Validate SalesBoard production

on:
  push:
    branches: [main]
    paths:
      - "salesboard/**"
      - ".github/workflows/salesboard-production-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "salesboard/**"
      - ".github/workflows/salesboard-production-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: "salesboard/.node-version"
      - name: Validate application files
        run: |
          test -f salesboard/index.html
          test -f salesboard/app/index.html
          test -f salesboard/app/app.js
          test -f salesboard/app/runtime-bridge.js
          test -f salesboard/app/app.css
          test -f salesboard/app/quality.css
          test -f salesboard/supabase/schema.sql
      - name: Validate JavaScript
        working-directory: salesboard
        run: npm run check
      - name: Validate authentication UX contracts
        run: |
          grep -Fq 'google-auth-button' salesboard/app/index.html
          grep -Fq 'id="keep-connected"' salesboard/app/index.html
          grep -Fq 'mobile-oauth-session-bridge' salesboard/app/index.html
          grep -Fq 'salesboard_mobile_oauth_session' salesboard/app/index.html
          grep -Fq 'app.js?v=20260813-google3' salesboard/app/index.html
          grep -Fq 'quality.css?v=20260813-google3' salesboard/app/index.html
          grep -Fq "provider: 'google'" salesboard/app/app.js
          grep -Fq 'authSessionStorage' salesboard/app/app.js
          grep -Fq 'prepareGoogleOAuthStorage' salesboard/app/app.js
          grep -Fq 'finalizeGoogleOAuthStorage' salesboard/app/app.js
      - name: Validate product safety contracts
        run: |
          grep -Fq 'complete_salesboard_onboarding' salesboard/supabase/009_atomic_onboarding_completion.sql
          grep -Fq 'goal_amount' salesboard/supabase/013_goal_allocations.sql
          grep -Fq 'account_is_archived' salesboard/supabase/014_archive_history_integrity.sql
          grep -Fq 'category_is_archived' salesboard/supabase/014_archive_history_integrity.sql
          grep -Fq 'requestConfirmation' salesboard/app/app.js
          grep -Fq 'reactivateEntity' salesboard/app/app.js
          if grep -Pq '\b(confirm|prompt|alert)\s*\(' salesboard/app/app.js salesboard/app/runtime-bridge.js salesboard/app.js salesboard/legal/legal.js; then exit 1; fi
          if grep -Pq '\breportValidity\s*\(' salesboard/app/app.js salesboard/app/runtime-bridge.js; then exit 1; fi
