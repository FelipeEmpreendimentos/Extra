name: Apply SalesBoard mobile OAuth fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/salesboard-production-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply mobile OAuth and plan card fix
        run: python salesboard/scripts/fix_mobile_oauth_and_trial_cards.py
      - name: Validate JavaScript
        run: |
          node --check salesboard/app/app.js
          node --check salesboard/scripts/ui_contract_audit.mjs
      - name: Verify fix markers
        run: |
          grep -Fq 'OAUTH_REMEMBER_KEY' salesboard/app/app.js
          grep -Fq 'prepareGoogleOAuthStorage' salesboard/app/app.js
          grep -Fq 'finalizeGoogleOAuthStorage' salesboard/app/app.js
          grep -Fq 'migrateAuthTokens' salesboard/app/app.js
          grep -Fq 'Mobile trial-plan alignment' salesboard/app/quality.css
      - name: Commit product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/app.js salesboard/app/quality.css salesboard/scripts/ui_contract_audit.mjs
          git commit -m "Fix mobile Google OAuth persistence and trial plan layout"
          git push origin main
