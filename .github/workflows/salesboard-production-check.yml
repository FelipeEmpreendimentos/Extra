name: Apply SalesBoard mobile Google session bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/salesboard-production-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Patch mobile Google session continuity and bust cache
        shell: python
        run: |
          from pathlib import Path

          path = Path('salesboard/app/index.html')
          text = path.read_text(encoding='utf-8')

          for old, new in {
              'href="app.css"': 'href="app.css?v=20260813-google3"',
              'href="quality.css"': 'href="quality.css?v=20260813-google3"',
              'src="runtime-bridge.js"': 'src="runtime-bridge.js?v=20260813-google3"',
              'src="app.js" defer': 'src="app.js?v=20260813-google3" defer',
          }.items():
              if old in text:
                  text = text.replace(old, new, 1)

          marker = 'id="mobile-oauth-session-bridge"'
          if marker not in text:
              bridge = r'''  <script id="mobile-oauth-session-bridge">
          (() => {
            const KEEP = 'salesboard_keep_connected';
            const SESSION_ONLY = 'salesboard_session_only';
            const OAUTH = 'salesboard_oauth_remember';
            const TEMP = 'salesboard_mobile_oauth_session';
            let persistent = null;
            let transient = null;
            try { persistent = window.localStorage; } catch {}
            try { transient = window.sessionStorage; } catch {}
            if (!persistent || !transient) return;

            const params = new URLSearchParams(location.search);
            const authKeys = () => {
              try { return Object.keys(persistent).filter((key) => key.startsWith('sb-') && key.endsWith('-auth-token')); }
              catch { return []; }
            };

            // If this was a non-persistent Google session and the browser was
            // reopened, remove the durable token before the SalesBoard app starts.
            if (persistent.getItem(TEMP) === '1' && transient.getItem(TEMP) !== '1' && params.get('oauth') !== 'google') {
              persistent.removeItem(KEEP);
              persistent.removeItem(OAUTH);
              persistent.removeItem(TEMP);
              for (const key of authKeys()) persistent.removeItem(key);
            }

            // On the Google callback, keep the token durable for the whole current
            // browser session. This avoids losing it mid-onboarding on Android
            // custom tabs. The next browser session will clear it when the user did
            // not choose "Manter conectado".
            if (params.get('oauth') === 'google' && persistent.getItem(OAUTH) === '0') {
              persistent.setItem(OAUTH, '1');
              persistent.setItem(KEEP, '1');
              persistent.setItem(TEMP, '1');
              transient.setItem(TEMP, '1');
              transient.removeItem(SESSION_ONLY);
            }

            document.addEventListener('change', (event) => {
              if (event.target?.id === 'keep-connected' && event.target.checked) {
                persistent.removeItem(TEMP);
                transient.removeItem(TEMP);
              }
            }, true);

            document.addEventListener('click', (event) => {
              const id = event.target?.closest?.('button')?.id;
              if (['logout-button', 'paywall-logout', 'trial-plan-logout'].includes(id)) {
                persistent.removeItem(TEMP);
                transient.removeItem(TEMP);
              }
            }, true);
          })();
          </script>

          '''
              anchor = '  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>'
              if anchor not in text:
                  raise SystemExit('Supabase script anchor missing')
              text = text.replace(anchor, bridge + anchor, 1)

          path.write_text(text, encoding='utf-8')
      - name: Verify bridge and asset version
        run: |
          grep -Fq 'mobile-oauth-session-bridge' salesboard/app/index.html
          grep -Fq 'salesboard_mobile_oauth_session' salesboard/app/index.html
          grep -Fq 'app.js?v=20260813-google3' salesboard/app/index.html
          grep -Fq 'quality.css?v=20260813-google3' salesboard/app/index.html
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/index.html
          git commit -m "Stabilize Google login in mobile browser sessions"
          git push origin main
