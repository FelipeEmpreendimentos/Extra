name: Align SalesBoard launch copy

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/salesboard-quality-css-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Align trial copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('salesboard/index.html')
          text=path.read_text(encoding='utf-8')
          old='Cadastre-se com e-mail e senha. O teste de 3 dias começa sem cartão.'
          new='Crie sua conta e escolha qual plano quer experimentar. O período começa só depois da sua escolha, sem cartão.'
          if old not in text:
              raise SystemExit('old trial copy not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit copy correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Align landing trial copy with plan selection"
          git push
