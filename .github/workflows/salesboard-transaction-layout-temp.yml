name: Repair SalesBoard transaction layout

on:
  push:
    branches: [main]
    paths:
      - "salesboard/scripts/fix_transaction_layout.py"
      - ".github/workflows/salesboard-transaction-layout-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Repair transaction field order
        run: python salesboard/scripts/fix_transaction_layout.py
      - name: Verify layout markers
        run: |
          grep -Fq 'id="tx-status-wrap"' salesboard/app/index.html
          python - <<'PY'
          from pathlib import Path
          t=Path('salesboard/app/index.html').read_text()
          assert t.index('id="tx-goal-wrap"') < t.index('id="tx-status-wrap"') < t.index('id="tx-goal-amount-wrap"')
          PY
      - name: Commit repaired layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/index.html
          git commit -m "Keep goal and status aligned in transaction form"
          git push origin main
