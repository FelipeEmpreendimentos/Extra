name: Repair SalesBoard auth callback messages

on:
  push:
    branches: [main]
    paths:
      - "salesboard/scripts/auth_callback_message_fix.py"
      - ".github/workflows/salesboard-auth-callback-fix-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Patch callback and auth statuses
        run: python salesboard/scripts/auth_callback_message_fix.py
      - name: Validate browser JavaScript
        run: node --check salesboard/app/app.js
      - name: Verify callback markers
        run: |
          grep -Fq 'authCallbackMessage' salesboard/app/app.js
          grep -Fq 'error_description' salesboard/app/app.js
          grep -Fq 'aria-live="polite"' salesboard/app/index.html
      - name: Commit repaired callback UX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/app.js salesboard/app/index.html
          git commit -m "Surface authentication callback failures"
          git push origin main
