name: Repair SalesBoard all-form validation

on:
  push:
    branches: [main]
    paths:
      - "salesboard/scripts/all_forms_validation_fix.py"
      - ".github/workflows/salesboard-all-forms-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Patch every form
        run: python salesboard/scripts/all_forms_validation_fix.py
      - name: Validate JavaScript
        run: |
          node --check salesboard/app/app.js
          node --check salesboard/scripts/ui_contract_audit.mjs
      - name: Verify every form is product-owned
        run: |
          for form in login-form register-form forgot-form recovery-form onboarding-form profile-form transaction-form entity-form confirm-form; do grep -Pq "<form id=\"$form\"[^>]*novalidate" salesboard/app/index.html || { echo "$form uses browser-native validation"; exit 1; }; done
          grep -Fq "Informe a data do lançamento." salesboard/app/app.js
          grep -Fq "Nome do espaço necessário" salesboard/app/app.js
          grep -Fq "const entityName" salesboard/app/app.js
      - name: Commit repaired forms
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/app.js salesboard/app/index.html salesboard/scripts/ui_contract_audit.mjs
          git commit -m "Use SalesBoard validation in every form"
          git push origin main
