name: Upgrade SalesBoard product rules

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/salesboard-product-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply product upgrade
        run: python salesboard/scripts/product_upgrade.py

      - name: Validate modified application
        run: |
          node --check salesboard/app/app.js
          grep -q '3 dias grátis' salesboard/index.html
          grep -q 'google-auth-button' salesboard/app/index.html
          grep -q 'report-year-chart' salesboard/app/index.html
          grep -q "interval '3 days'" salesboard/supabase/schema.sql

      - name: Commit upgrade
        run: |
          if git diff --quiet; then
            echo "Nothing to upgrade"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard
          git commit -m "Upgrade SalesBoard trial auth plans and reports"
          git push origin main
