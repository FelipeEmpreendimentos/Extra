name: Repair SalesBoard interaction consistency

on:
  push:
    branches: [main]
    paths:
      - "salesboard/scripts/full_interaction_audit_fix.py"
      - ".github/workflows/salesboard-full-interaction-fix-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Patch all interaction flows
        run: python salesboard/scripts/full_interaction_audit_fix.py
      - name: Validate browser JavaScript
        run: |
          node --check salesboard/app/app.js
          node --check salesboard/app/runtime-bridge.js
          node --check salesboard/scripts/ui_contract_audit.mjs
      - name: Verify consistency markers
        run: |
          grep -Fq 'reactivateEntity' salesboard/app/app.js
          grep -Fq 'setResendConfirmation' salesboard/app/app.js
          grep -Fq 'form.noValidate = true' salesboard/app/app.js
          grep -Fq 'Começar 3 dias no' salesboard/app/app.js
          grep -Fq 'id="archived-items"' salesboard/app/index.html
          grep -Fq 'id="resend-confirmation"' salesboard/app/index.html
          if grep -Pq '\b(confirm|prompt|alert)\s*\(' salesboard/app/app.js salesboard/app/runtime-bridge.js salesboard/app.js salesboard/legal/legal.js; then echo 'Native dialog found'; exit 1; fi
      - name: Commit repaired product
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/app.js salesboard/app/index.html salesboard/app/app.css salesboard/scripts/ui_contract_audit.mjs .github/workflows/salesboard-production-check.yml
          git commit -m "Standardize auth notifications and archived reactivation"
          git push origin main
