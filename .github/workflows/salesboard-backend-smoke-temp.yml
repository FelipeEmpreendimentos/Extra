name: SalesBoard backend smoke audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/salesboard-backend-smoke-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public health endpoint
        shell: bash
        run: |
          set -u
          BASE='https://azjabgqvkkctgzqacpue.supabase.co/functions/v1'
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE/salesboard-health")
          echo "HEALTH_HTTP=$code"
          cat /tmp/health.json
          echo
      - name: Authenticated endpoints reject anonymous requests
        shell: bash
        run: |
          BASE='https://azjabgqvkkctgzqacpue.supabase.co/functions/v1'
          for fn in salesboard-checkout salesboard-billing-portal salesboard-delete-account; do
            code=$(curl -sS -o "/tmp/$fn.json" -w '%{http_code}' -X POST -H 'Origin: https://felipeempreendimentos.github.io' -H 'Content-Type: application/json' --data '{}' "$BASE/$fn")
            echo "$fn HTTP=$code BODY=$(cat /tmp/$fn.json)"
            if [ "$code" != "401" ] && [ "$fn" != "salesboard-delete-account" ]; then exit 1; fi
          done
      - name: CORS preflight
        shell: bash
        run: |
          BASE='https://azjabgqvkkctgzqacpue.supabase.co/functions/v1'
          for fn in salesboard-checkout salesboard-billing-portal salesboard-delete-account; do
            headers=$(mktemp)
            code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://felipeempreendimentos.github.io' -H 'Access-Control-Request-Method: POST' "$BASE/$fn")
            echo "$fn OPTIONS=$code"
            grep -i '^access-control-allow-origin:' "$headers" || exit 1
            [ "$code" = "204" ] || exit 1
          done
