name: Repair SalesBoard demo archive semantics

on:
  push:
    branches: [main]
    paths:
      - "salesboard/scripts/fix_demo_archive_semantics.py"
      - ".github/workflows/salesboard-demo-archive-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Align demo archive behavior with production
        run: python salesboard/scripts/fix_demo_archive_semantics.py
      - name: Validate browser JavaScript
        run: node --check salesboard/app/app.js
      - name: Verify archive marker
        run: grep -Fq 'catalogItem.archived = true' salesboard/app/app.js
      - name: Commit archive behavior repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/app.js
          git commit -m "Align demo archive behavior with production"
          git push origin main
