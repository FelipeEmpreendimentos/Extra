name: SalesBoard responsive audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/salesboard-responsive-audit-temp.yml"
      - "salesboard/scripts/responsive_audit.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install browser audit dependency
        working-directory: salesboard
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/salesboard-http.log 2>&1 &
          echo $! > /tmp/salesboard-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/salesboard/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/salesboard-http.log
          exit 1
      - name: Run viewport matrix
        run: node salesboard/scripts/responsive_audit.mjs
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salesboard-responsive-audit
          path: salesboard/audit-artifacts
          if-no-files-found: warn
          retention-days: 3
