name: SalesBoard UI polish temporary

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/salesboard-ui-polish-temp.yml"
      - "salesboard/scripts/apply_ui_polish.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply UI polish
        run: python salesboard/scripts/apply_ui_polish.py
      - name: Validate JavaScript
        run: node --check salesboard/app/runtime-bridge.js
      - name: Validate markers
        run: |
          grep -q "SB_MODAL_SYSTEM_V2" salesboard/app/runtime-bridge.js
          grep -q "SB_UI_SYSTEM_V2" salesboard/app/app.css
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/runtime-bridge.js salesboard/app/app.css
          git commit -m "Polish SalesBoard modals and money fields"
          git push
