name: Guard SalesBoard Google OAuth

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/salesboard-google-guard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Guard disabled Google provider
        run: python salesboard/scripts/guard_google_provider.py

      - name: Validate JavaScript
        run: |
          node --check salesboard/app/app.js
          grep -Fq 'googleProviderAvailable' salesboard/app/app.js
          grep -Fq '/auth/v1/settings' salesboard/app/app.js

      - name: Commit Google OAuth guard
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/app.js
          git commit -m "Prevent redirect when Google OAuth is disabled"
          git push origin main
