name: Repair SalesBoard UI consistency

on:
  push:
    branches: [main]
    paths:
      - "salesboard/scripts/fix_ui_consistency.py"
      - ".github/workflows/salesboard-ui-consistency-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply consistency repair
        run: python salesboard/scripts/fix_ui_consistency.py
      - name: Validate browser JavaScript
        run: |
          node --check salesboard/app/app.js
          node --check salesboard/app/runtime-bridge.js
      - name: Verify no native browser dialogs remain
        run: |
          if grep -Pq '\b(confirm|prompt|alert)\s*\(' salesboard/app/app.js salesboard/app/runtime-bridge.js; then
            echo "Native browser dialog API still present"
            exit 1
          fi
          grep -Fq 'id="confirm-modal"' salesboard/app/index.html
          grep -Fq 'transaction-grid' salesboard/app/index.html
      - name: Commit repaired UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/app.js salesboard/app/index.html salesboard/app/quality.css salesboard/app/runtime-bridge.js
          git commit -m "Standardize confirmations and align transaction modal"
          git push origin main
