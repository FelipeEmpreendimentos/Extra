name: Harden SalesBoard user-facing errors

on:
  push:
    branches: [main]
    paths:
      - "salesboard/scripts/friendly_error_hardening.py"
      - ".github/workflows/salesboard-error-hardening-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Harden messages
        run: python salesboard/scripts/friendly_error_hardening.py
      - name: Validate JavaScript
        run: node --check salesboard/app/app.js
      - name: Verify mappings
        run: |
          grep -Fq 'email_address_invalid' salesboard/app/app.js
          grep -Fq 'account_is_archived' salesboard/app/app.js
          grep -Fq 'session_not_found' salesboard/app/app.js
          grep -Fq 'Não foi possível concluir esta ação de acesso' salesboard/app/app.js
      - name: Commit hardened messages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/app.js
          git commit -m "Harden user-facing error messages"
          git push origin main
