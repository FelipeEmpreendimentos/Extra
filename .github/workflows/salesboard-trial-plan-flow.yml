name: Apply SalesBoard selectable trial flow

on:
  push:
    branches: [main]
    paths:
      - "salesboard/scripts/patch_trial_plan_flow.py"
      - ".github/workflows/salesboard-trial-plan-flow.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply selectable trial plan flow
        run: python salesboard/scripts/patch_trial_plan_flow.py

      - name: Validate JavaScript syntax
        run: node --check salesboard/app/app.js && node --check salesboard/app/runtime-bridge.js

      - name: Validate trial flow markers
        run: |
          grep -Fq 'trial-plan-screen' salesboard/app/index.html
          grep -Fq 'data-start-trial="essential"' salesboard/app/index.html
          grep -Fq 'data-start-trial="pro"' salesboard/app/index.html
          grep -Fq 'start_salesboard_trial' salesboard/app/app.js
          grep -Fq 'salesboard_trial_eligible' salesboard/app/app.js
          grep -Fq '007_choose_trial_plan_once.sql' .github/workflows/salesboard-production-check.yml

      - name: Commit application changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/app.js salesboard/app/index.html salesboard/app/app.css salesboard/app/runtime-bridge.js salesboard/legal/privacidade.html .github/workflows/salesboard-production-check.yml
          git commit -m "Add selectable one-time trial plan experience"
          git push origin main
