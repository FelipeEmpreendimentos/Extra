name: Repair SalesBoard archive history catalogs

on:
  push:
    branches: [main]
    paths:
      - "salesboard/scripts/fix_archive_catalogs.py"
      - ".github/workflows/salesboard-archive-catalogs-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Preserve archived historical catalogs
        run: python salesboard/scripts/fix_archive_catalogs.py
      - name: Validate browser JavaScript
        run: node --check salesboard/app/app.js
      - name: Verify historical catalog markers
        run: |
          grep -Fq 'accountCatalog' salesboard/app/app.js
          grep -Fq 'categoryCatalog' salesboard/app/app.js
          grep -Fq 'allCategories()' salesboard/app/app.js
          grep -Fq 'allAccounts()' salesboard/app/app.js
      - name: Commit archive history repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salesboard/app/app.js
          git commit -m "Preserve archived account and category history"
          git push origin main
